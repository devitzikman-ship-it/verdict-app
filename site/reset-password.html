<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VERDICT — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0f;font-family:'Inter',-apple-system,sans-serif;color:#fff}
.card{background:#12121a;border:1px solid #1e1e2a;border-radius:16px;padding:40px;width:100%;max-width:400px;text-align:center}
.logo{font-size:24px;font-weight:900;margin-bottom:8px;letter-spacing:-0.3px}
.sub{color:#8b8b9e;font-size:13px;margin-bottom:28px}
input{width:100%;padding:12px 16px;background:#14141e;border:1px solid #2a2a3a;color:#fff;font-size:14px;border-radius:10px;outline:none;font-family:inherit;margin-bottom:12px;transition:border-color .2s}
input:focus{border-color:#4e8bff}
input::placeholder{color:#55556a}
.btn{width:100%;padding:12px;background:#4e8bff;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:4px}
.btn:hover{background:#5a95ff;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.msg{font-size:13px;margin-top:16px;padding:10px;border-radius:8px}
.msg.ok{color:#00d4aa;background:rgba(0,212,170,0.08)}
.msg.err{color:#ff4757;background:rgba(255,71,87,0.08)}
.back{display:inline-block;margin-top:20px;color:#8b8b9e;font-size:12px;text-decoration:none;font-weight:600}
.back:hover{color:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="logo">VERDICT</div>
  <div class="sub">Enter your new password</div>
  <form id="resetForm">
    <input type="password" id="pw1" placeholder="New password (8+ characters)" minlength="8" required autocomplete="new-password" />
    <input type="password" id="pw2" placeholder="Confirm password" minlength="8" required autocomplete="new-password" />
    <button type="submit" class="btn" id="submitBtn">Reset Password</button>
  </form>
  <div id="msg" class="msg" style="display:none"></div>
  <a href="index.html" class="back">Back to login</a>
</div>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');
const msg = document.getElementById('msg');
const form = document.getElementById('resetForm');
const btn = document.getElementById('submitBtn');

if (!token) {
  form.style.display = 'none';
  msg.style.display = 'block';
  msg.className = 'msg err';
  msg.textContent = 'Invalid reset link — no token found.';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;

  if (pw1 !== pw2) {
    msg.style.display = 'block';
    msg.className = 'msg err';
    msg.textContent = 'Passwords do not match.';
    return;
  }
  if (pw1.length < 8) {
    msg.style.display = 'block';
    msg.className = 'msg err';
    msg.textContent = 'Password must be at least 8 characters.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Resetting...';
  msg.style.display = 'none';

  try {
    const r = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pw1 }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Reset failed');

    msg.style.display = 'block';
    msg.className = 'msg ok';
    msg.textContent = 'Password updated! Redirecting to login...';
    form.style.display = 'none';
    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
  } catch (err) {
    msg.style.display = 'block';
    msg.className = 'msg err';
    msg.textContent = err.message;
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
});
</script>
</body>
</html>
